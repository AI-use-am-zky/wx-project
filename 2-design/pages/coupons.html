<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=402, initial-scale=1, user-scalable=no" />
  <title>红包卡券</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body data-title="红包卡券" data-back="me.html">
  <div id="app" class="pad">
    <div class="tabs" style="margin-bottom:14px">
      <div class="tab on">可使用</div>
      <div class="tab" style="opacity:.7">已过期</div>
    </div>

    <div class="empty" style="padding:28px 12px">
      <i class="ri-coupon-3-line"></i>
      <div class="h2">暂无可用卡券</div>
      <p class="sub mt-8">第一期不做营销红包。入口已保留，避免和「我的」结构对不齐。</p>
    </div>

    <div class="h2 faint" style="margin:8px 4px 12px;font-weight:500">示例（不可用）</div>
    <div class="coupon used">
      <div class="left">
        <span class="yen">¥</span>
        <span class="num">50</span>
      </div>
      <div class="body">
        <div class="h2" style="font-size:15px">新客寄宠券</div>
        <div class="sub mt-8">满 800 可用 · 不可与保价同享</div>
        <div class="faint mt-8">已于 08月01日过期</div>
      </div>
    </div>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>

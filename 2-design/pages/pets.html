<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=402, initial-scale=1, user-scalable=no" />
  <title>我的宠物</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body data-title="我的宠物" data-back="me.html">
  <div id="app" class="pad-b pad">
    <div class="card pet-card" data-go="pet-edit.html">
      <img class="ava" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&q=80" alt="" />
      <div class="grow">
        <div class="row">
          <div class="h2" style="font-size:16px">奶茶</div>
          <span class="chip">猫</span>
        </div>
        <div class="sub mt-8">英国短毛猫 · 4.5kg · 母</div>
      </div>
    </div>
    <div class="card pet-card" data-go="pet-edit.html">
      <img class="ava" src="https://images.unsplash.com/photo-1574158622682-e40e69881006?w=200&q=80" alt="" />
      <div class="grow">
        <div class="row">
          <div class="h2" style="font-size:16px">雪球</div>
          <span class="chip">猫</span>
        </div>
        <div class="sub mt-8">布偶 · 4.2kg · 公</div>
      </div>
    </div>
    <div class="card pet-card" data-go="pet-edit.html">
      <img class="ava" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=200&q=80" alt="" />
      <div class="grow">
        <div class="row">
          <div class="h2" style="font-size:16px">阿福</div>
          <span class="chip">狗</span>
        </div>
        <div class="sub mt-8">金毛 · 22.0kg · 公</div>
      </div>
    </div>
    <div class="footer-bar">
      <button class="btn" data-go="pet-edit.html"><i class="ri-add-line"></i> 添加宠物</button>
    </div>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>

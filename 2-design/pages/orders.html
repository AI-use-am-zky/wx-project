<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=402, initial-scale=1, user-scalable=no" />
  <title>宠途空运 · 订单</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body data-title="我的订单" data-tab="orders" data-back="none">
  <div id="app">
    <div class="tabs-wrap">
      <div class="tabs">
        <div class="tab on" data-filter="all">全部</div>
        <div class="tab" data-filter="pending">待付款</div>
        <div class="tab" data-filter="transit">出行中</div>
        <div class="tab" data-filter="done">已完成</div>
        <div class="tab" data-filter="cancelled">已取消</div>
      </div>
    </div>

    <div class="pad" style="padding-top: 0;">
      <div class="card order" data-status="pending" data-go="order-detail.html?id=pay">
        <img class="avatar" src="https://images.unsplash.com/photo-1574158622682-e40e69881006?w=200&q=80" alt="" />
        <div class="meta">
          <div class="top">
            <div class="pet">雪球 · 布偶</div>
            <span class="st st-pay">待付款</span>
          </div>
          <div class="path">北京 朝阳 → 上海 徐汇 · 4.2kg</div>
          <div class="bot">
            <span class="faint">08月26日创建</span>
            <span class="price">¥1,280</span>
          </div>
        </div>
      </div>

      <div class="card order" data-status="transit" data-go="order-detail.html">
        <img class="avatar" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&q=80" alt="" />
        <div class="meta">
          <div class="top">
            <div class="pet">奶茶 · 英短</div>
            <span class="st st-go">运输中</span>
          </div>
          <div class="path">杭州 西湖 → 成都 锦江 · 4.5kg</div>
          <div class="bot">
            <span class="faint">运单 SF26591803</span>
            <span class="price">¥1,860</span>
          </div>
        </div>
      </div>

      <div class="card order" data-status="transit" data-go="surcharge.html">
        <img class="avatar" src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=200&q=80" alt="" />
        <div class="meta">
          <div class="top">
            <div class="pet">土豆 · 柯基</div>
            <span class="st st-warn">待补差</span>
          </div>
          <div class="path">深圳 南山 → 西安 雁塔 · 8.6kg</div>
          <div class="bot">
            <span class="faint">复秤超出 1.4kg</span>
            <span class="price">¥980</span>
          </div>
        </div>
      </div>

      <div class="card order" data-status="done" data-go="order-detail.html?id=done">
        <img class="avatar" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=200&q=80" alt="" />
        <div class="meta">
          <div class="top">
            <div class="pet">阿福 · 金毛</div>
            <span class="st st-done">已签收</span>
          </div>
          <div class="path">广州 天河 → 武汉 武昌 · 22.0kg</div>
          <div class="bot">
            <span class="faint">08月18日完成</span>
            <span class="price">¥1,560</span>
          </div>
        </div>
      </div>

      <div class="card order" data-status="cancelled" data-go="order-detail.html?id=cancel">
        <img class="avatar" src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=200&q=80" alt="" />
        <div class="meta">
          <div class="top">
            <div class="pet">豆豆 · 泰迪</div>
            <span class="st st-cancel">已取消</span>
          </div>
          <div class="path">成都 武侯 → 杭州 滨江 · 3.1kg</div>
          <div class="bot">
            <span class="faint">未揽收 · 已退款</span>
            <span class="price">¥720</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>

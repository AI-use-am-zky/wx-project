<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=402, initial-scale=1, user-scalable=no" />
  <title>填写地址</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body data-title="寄收地址" data-back="cities.html">
  <div id="app" class="pad-b pad">
    <div class="card">
      <div class="row mb-12">
        <div class="h2">寄件人 · 上门取件</div>
        <span class="link" id="pasteAddr"><i class="ri-clipboard-line"></i> 粘贴识别</span>
      </div>
      <div class="locked"><i class="ri-map-pin-2-line"></i> 浙江省 杭州市</div>
      <div class="field">
        <label>姓名</label>
        <input id="sName" value="陈七" placeholder="开门联系人" />
      </div>
      <div class="field">
        <label>手机号</label>
        <input id="sPhone" value="13500135005" maxlength="11" placeholder="11 位手机号" />
      </div>
      <div class="field">
        <label>区 / 县</label>
        <input id="sDist" value="西湖区" placeholder="例如 西湖区" />
      </div>
      <div class="field">
        <label>详细地址</label>
        <textarea id="sDetail" rows="2">文三路 478 号华星时代广场 12 楼</textarea>
      </div>
    </div>

    <div class="card">
      <div class="row mb-12">
        <div class="h2">收件人 · 上门派送</div>
        <span class="link" data-go="toast:已识别收件地址">粘贴识别</span>
      </div>
      <div class="locked"><i class="ri-map-pin-2-line"></i> 四川省 成都市</div>
      <div class="field">
        <label>姓名</label>
        <input value="李四" placeholder="开门联系人" />
      </div>
      <div class="field">
        <label>手机号</label>
        <input value="13900139002" maxlength="11" />
      </div>
      <div class="field">
        <label>区 / 县</label>
        <input value="锦江区" />
      </div>
      <div class="field">
        <label>详细地址</label>
        <textarea rows="2">红星路三段 1 号 IFS 国际金融中心 1 号楼 1808</textarea>
      </div>
    </div>

    <button class="btn btn-ghost mt-12" id="saveAddrBook">保存到地址簿</button>
    <div class="footer-bar">
      <button class="btn" data-go="pet-quote.html">下一步：宠物与取件日</button>
    </div>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>

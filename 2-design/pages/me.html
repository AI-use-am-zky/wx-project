<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=402, initial-scale=1, user-scalable=no" />
  <title>宠途空运 · 我的</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body data-title="" data-tab="me" data-nav="light" data-back="none">
  <div id="navExtra">
    <div class="nav-ico" data-go="messages.html"><i class="ri-notification-3-line"></i></div>
    <div class="nav-ico" data-go="settings.html"><i class="ri-settings-3-line"></i></div>
  </div>
  <div id="app">
    <div class="me-hero">
      <div class="profile" data-go="settings.html">
        <div class="ava">途</div>
        <div class="grow">
          <div class="name">135****5005</div>
          <div class="sub">微信已授权 · 点击管理账号</div>
        </div>
        <i class="ri-arrow-right-s-line faint" style="font-size:20px"></i>
      </div>
    </div>

    <div class="pad" style="padding-top:0">
      <div class="card">
        <div class="row">
          <div class="h2">我的订单</div>
          <span class="link" data-go="orders.html">查看全部 <i class="ri-arrow-right-s-line"></i></span>
        </div>
        <div class="grid4">
          <div class="gitem" data-go="orders.html">
            <div class="gico"><i class="ri-wallet-3-line"></i><span class="badge">1</span></div>
            待付款
          </div>
          <div class="gitem" data-go="orders.html">
            <div class="gico"><i class="ri-plane-line"></i><span class="badge">2</span></div>
            出行中
          </div>
          <div class="gitem" data-go="orders.html">
            <div class="gico"><i class="ri-checkbox-circle-line"></i></div>
            已完成
          </div>
          <div class="gitem" data-go="orders.html">
            <div class="gico"><i class="ri-close-circle-line"></i></div>
            已取消
          </div>
        </div>
      </div>

      <div class="card row-link" data-go="pets.html">
        <div class="gico"><i class="ri-bear-smile-line"></i></div>
        <div class="grow">
          <div class="h2" style="font-size:15px">我的宠物</div>
          <div class="faint">奶茶、雪球 等 3 只档案</div>
        </div>
        <i class="ri-arrow-right-s-line faint"></i>
      </div>

      <div class="card">
        <div class="h2">更多服务</div>
        <div class="grid4">
          <div class="gitem" data-go="me-addresses.html">
            <div class="gico"><i class="ri-map-pin-line"></i></div>
            地址管理
          </div>
          <div class="gitem" data-go="coupons.html">
            <div class="gico"><i class="ri-coupon-3-line"></i></div>
            红包卡券
          </div>
          <div class="gitem" data-go="me-addresses.html">
            <div class="gico"><i class="ri-contacts-book-line"></i></div>
            常用联系人
          </div>
          <div class="gitem" data-go="docs.html">
            <div class="gico"><i class="ri-folder-shield-line"></i></div>
            检疫资料
          </div>
        </div>
      </div>

      <div class="card">
        <div class="h2">其他</div>
        <div class="grid4" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
          <div class="gitem" data-go="invoice.html">
            <div class="gico"><i class="ri-bill-line"></i></div>
            电子发票
          </div>
          <div class="gitem" data-go="agreement.html">
            <div class="gico"><i class="ri-file-paper-2-line"></i></div>
            运输协议
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=402, initial-scale=1, user-scalable=no" />
  <title>地址管理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body data-title="地址管理" data-back="me.html">
  <div id="app" class="pad-b pad">
    <div class="card">
      <div class="row">
        <div>
          <div class="h2" style="font-size:15px">陈七 135****5005</div>
          <div class="sub mt-8">浙江省杭州市西湖区文三路 478 号华星时代广场 12 楼</div>
        </div>
        <span class="chip">寄件</span>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div>
          <div class="h2" style="font-size:15px">李四 139****9002</div>
          <div class="sub mt-8">四川省成都市锦江区红星路三段 1 号 IFS 1 号楼 1808</div>
        </div>
        <span class="chip gold">收件</span>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div>
          <div class="h2" style="font-size:15px">张三 138****8001</div>
          <div class="sub mt-8">北京市朝阳区建国路 88 号 SOHO 现代城 5 号楼</div>
        </div>
        <span class="chip">寄件</span>
      </div>
    </div>

    <div class="card hide" id="addrForm">
      <div class="h2 mb-8">新增地址</div>
      <div class="field"><label>姓名</label><input placeholder="开门联系人" /></div>
      <div class="field"><label>手机</label><input placeholder="11 位手机号" /></div>
      <div class="field"><label>省 / 市 / 区</label><input placeholder="例如 浙江 杭州 西湖" /></div>
      <div class="field"><label>详细门牌</label><input placeholder="路名、楼号、室" /></div>
      <button class="btn mt-12" id="saveNewAddr">保存</button>
    </div>

    <div class="footer-bar">
      <button class="btn" id="openAddrForm"><i class="ri-add-line"></i> 新增地址</button>
    </div>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>
